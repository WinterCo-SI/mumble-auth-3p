[package]
name = "eve-mumble-bridge"
version = "0.1.0"
edition = "2021"
description = "EVE Online SSO -> Mumble auth bridge"

[lib]
name = "eve_mumble_bridge"
path = "src/lib.rs"

[[bin]]
name = "eve-mumble-bridge"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "fs"] }
tower-http = { version = "0.6", features = ["trace"] }

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

dashmap = "6"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
url = "2"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

anyhow = "1"
thiserror = "1"
